name: Bug report
description: Report a reproducible software problem without personal or device data.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Do not include health data, serial numbers, device identifiers, database files, raw BLE captures, APKs, or vendor binaries.
  - type: input
    id: version
    attributes:
      label: Version
      description: Package version or commit ID.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: List the smallest synthetic steps that reproduce the problem.
      placeholder: |
        1. Run ...
        2. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed health data, device identifiers, and raw captures from this report.
          required: true
